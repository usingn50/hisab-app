services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hisab
      POSTGRES_USER: hisab
      POSTGRES_PASSWORD: hisab
    ports:
      - "5432:5432"
    volumes:
      - hisab_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hisab -d hisab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hisab_postgres_data:
